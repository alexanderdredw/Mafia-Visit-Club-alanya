<meta property="og:title" content="Mafia Visit Club — спортивная мафия в Аланье">

<style>
/* Layout: sticky top bar + hash-routed sections; the "game card" with a 10-seat table strip is the signature element. */
:root{
  /* Premium night club: espresso black, champagne hairlines, one wine-red accent */
  --bg:#110c0a; --surface:#1b1411; --surface2:#231a16; --line:#33281f; --fg:#f4ebdf; --muted:#a8937f;
  --red:#c4352b; --red-ink:#fff; --brass:#c9a66b; --ok:#5fae74; --seat:#2a201a;
  --f-display:"Cormorant Garamond", "Times New Roman", Georgia, serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
h2{font-size:clamp(2.1rem,5vw,3.2rem);font-weight:600;letter-spacing:-.01em}
h3{font-size:1.45rem;font-weight:600}
p{margin:0}
a{color:inherit}
button,input{font:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.label{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--brass)}

/* top bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto}
.brand b{font-family:var(--f-display);font-size:1.4rem;font-weight:700;letter-spacing:.02em}
.brand .mark-logo{height:38px;width:auto;border-radius:3px;display:block;box-shadow:0 0 0 1px rgba(201,166,107,.35)}
nav.menu{display:flex;gap:4px;flex-wrap:wrap}
nav.menu a{text-decoration:none;padding:6px 10px;border-radius:6px;font-weight:500;font-size:.95rem;color:var(--muted)}
nav.menu a[aria-current="page"]{color:var(--fg);background:var(--surface);box-shadow:inset 0 -2px 0 var(--red)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--muted);padding:5px 12px;cursor:pointer;font-family:var(--f-mono);font-size:.8rem}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
@media (max-width:480px){.brand{gap:8px}.brand .mark-logo{height:32px}.brand b{font-size:1.12rem}.hdr-cta{padding:9px 14px}}
.hdr-cta{white-space:nowrap}
.burger{display:none;flex:none;width:42px;height:42px;border:1px solid var(--line);background:transparent;border-radius:4px;flex-direction:column;justify-content:center;align-items:center;gap:5px;cursor:pointer;padding:0}
.burger span{display:block;width:18px;height:1.5px;background:var(--fg);transition:transform .25s,opacity .2s}
header.open .burger span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
header.open .burger span:nth-child(2){opacity:0}
header.open .burger span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}
nav .lang-m{display:none}
@media (max-width:860px){
  .top .wrap{flex-wrap:nowrap;gap:10px}
  nav.menu{display:none;position:absolute;left:0;right:0;top:100%;height:calc(100dvh - 100%);min-height:calc(100vh - 64px);flex-direction:column;flex-wrap:nowrap;gap:0;overflow:auto;background:var(--bg);border-top:1px solid var(--line);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:9}
  header.open nav.menu{display:flex}
  nav.menu a{font-family:var(--f-display);font-size:1.9rem;font-weight:600;color:var(--fg);padding:14px 0;border-bottom:1px solid var(--line);border-radius:0;white-space:normal}
  nav.menu a[aria-current="page"]{background:none;box-shadow:none;color:var(--red)}
  nav .lang-m{display:flex;align-self:flex-start;margin-top:24px}
  .top .wrap>.lang-d{display:none}
  .burger{display:flex}
}
@media (max-width:420px){.brand b{display:none}}

main section{padding-block:40px 64px}

/* hero: full-bleed photo */
.hero-full{position:relative;isolation:isolate;min-height:clamp(560px,82vh,820px);display:flex;align-items:flex-end;overflow:hidden;border-bottom:1px solid var(--line)}
.hero-full canvas,.hero-img{position:absolute;inset:0;width:100%;height:100%;z-index:-3}
.hero-img{background-size:cover;background-position:center 30%;transform-origin:50% 100%;z-index:-2;opacity:0;transition:opacity .8s ease}
.hero-img.on{opacity:1}
.hero-shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(17,12,10,.94) 0%,rgba(17,12,10,.82) 30%,rgba(17,12,10,.35) 58%,rgba(17,12,10,.1) 80%),linear-gradient(180deg,rgba(17,12,10,.55) 0%,transparent 22%,transparent 60%,var(--bg) 100%)}
.hero-inner{position:relative;z-index:1;width:100%;padding-block:120px 56px;display:grid;grid-template-columns:1.35fr 1fr;gap:48px;align-items:end}
.hero-inner h1{font-size:clamp(3rem,9vw,6.6rem);font-weight:600;line-height:.95;letter-spacing:-.02em;margin-top:14px}
.hero-inner h1 em{color:var(--red);font-style:italic;font-weight:500;display:block}
.hero-inner p.lead{font-size:1.12rem;font-weight:500;color:#f1e7da;max-width:46ch;margin-top:22px}
.hero-inner .label{color:#dcc08c}
.eyebrow{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px}
.eyebrow .label{display:inline-flex;align-items:center;gap:12px;white-space:nowrap;font-size:.7rem;letter-spacing:.22em}
.eyebrow .label::before{content:"";width:28px;height:1px;background:currentColor;opacity:.8}
.loc-pill{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border:1px solid rgba(201,166,107,.45);border-radius:999px;background:rgba(17,12,10,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;color:#f1e7da;white-space:nowrap}
.loc-pill i{width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(196,53,43,.25)}
.hero-inner h1,.hero-inner p.lead,.hero-inner .label{text-shadow:0 1px 2px rgba(0,0,0,.5),0 4px 30px rgba(0,0,0,.45)}
.hero-inner h1{color:#fbf6ef}
.hero-inner h1 em{color:#e0473b}
.facts{display:flex;gap:36px;flex-wrap:wrap;margin-top:28px;padding-top:20px;border-top:1px solid rgba(201,166,107,.35)}
.facts div{display:flex;flex-direction:column;gap:2px}
.facts strong{font-family:var(--f-display);font-size:2.1rem;font-weight:600;line-height:1;font-variant-numeric:lining-nums tabular-nums;color:#fbf6ef}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 24px;border-radius:2px;border:1px solid rgba(244,235,223,.5);background:transparent;color:var(--fg);font-weight:700;font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background .2s,border-color .2s}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn.primary:hover{background:#d8443a}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:9px 16px;font-size:.75rem}
.hero-inner .game{background:rgba(27,20,17,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
@media (max-width:860px){
  .hero-full{min-height:0;display:block}
  .hero-full canvas,.hero-img,.hero-shade{inset:0 0 auto 0;height:min(64vh,540px)}
  .hero-img{background-position:center top}
  .hero-shade{background:linear-gradient(180deg,rgba(17,12,10,.35) 0%,rgba(17,12,10,.05) 30%,rgba(17,12,10,.55) 68%,var(--bg) 100%)}
  .hero-inner{grid-template-columns:1fr;gap:36px;padding-top:calc(min(64vh,540px) - 64px);padding-bottom:40px}
  .hero-inner h1{margin-top:18px}
  .hero-inner h1{font-size:clamp(2.9rem,13vw,4.2rem)}
  .facts{gap:26px}
}

/* atmosphere gallery */
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:24px}
.gallery figure{margin:0;aspect-ratio:4/5;max-width:100%;overflow:hidden;background:var(--surface)}
.gallery img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.gallery figure:hover img{transform:scale(1.04)}
.quote{font-family:var(--f-display);font-style:italic;font-size:clamp(1.6rem,4vw,2.6rem);line-height:1.2;max-width:24ch;text-wrap:balance;margin:72px 0 64px;padding-left:24px;border-left:1px solid var(--brass)}

/* admin photos */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.photo-grid figure{margin:0;position:relative;aspect-ratio:4/5;max-width:100%;background:var(--surface);overflow:hidden}
.photo-grid img{width:100%;height:100%;object-fit:cover}
.photo-grid button{position:absolute;top:6px;right:6px;border:0;background:rgba(17,12,10,.8);color:var(--fg);padding:4px 9px;cursor:pointer;font-size:.8rem}
.hero-prev{aspect-ratio:16/7;max-width:100%;background:var(--surface) center/cover;margin-top:14px;border:1px solid var(--line)}
.upl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}

/* next game card */
.game{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:20px;display:flex;flex-direction:column;gap:14px}
.game-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.game-date{font-family:var(--f-display);font-size:1.9rem;font-weight:600;line-height:1.05}
.game-time{font-family:var(--f-mono);color:var(--brass)}
.seats{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.seat{aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--seat);display:grid;place-items:center;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.seat.taken{background:var(--fg);color:var(--bg)}
.seat.me{background:var(--red);color:var(--red-ink)}
.status{font-size:.9rem;color:var(--muted)}
.status b{color:var(--fg)}
.players{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.players li{font-size:.85rem;padding:3px 10px;border-radius:999px;border:1px solid var(--line);display:flex;align-items:center;gap:6px}
.players li.wait{border-style:dashed;color:var(--muted)}
.players li .n{font-family:var(--f-mono);color:var(--muted);font-size:.75rem}
.players li button{border:0;background:none;color:var(--red);cursor:pointer;padding:0 2px}

/* schedule grid */
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:24px}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.section-head p{color:var(--muted);max-width:60ch;margin-top:8px}

/* sign-in panel */
.join{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:18px 20px;margin-top:20px;display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.join label{display:flex;flex-direction:column;gap:4px;flex:1 1 220px}
.join input{padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.note{font-size:.9rem;color:var(--muted);flex-basis:100%}
.note.warn{color:var(--red)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:20;font-weight:500}

/* evening timeline */
.timeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0;margin-top:24px;border-top:1px solid var(--line)}
.timeline div{padding:16px 16px 16px 0;border-right:1px solid var(--line)}
.timeline div:last-child{border-right:0}
.timeline time{font-family:var(--f-display);color:var(--brass);font-size:2rem;font-weight:600}
.timeline p{color:var(--muted);font-size:.95rem}

/* roles */
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:24px}
.role{border:1px solid var(--line);border-radius:4px;padding:18px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.role .count{font-family:var(--f-mono);font-size:.8rem}
.role.black .count{color:var(--fg)} .role.red .count{color:var(--red)}
.role .suit{width:28px;height:28px}
.rules-body{display:grid;grid-template-columns:220px 1fr;gap:32px;margin-top:40px}
.rules-body ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:14px;max-width:68ch}
.rules-body h3{margin-bottom:4px}
.rules-body .aside{color:var(--muted);font-size:.95rem}
.rules-body>*{min-width:0}
@media (max-width:720px){.rules-body{grid-template-columns:minmax(0,1fr);gap:14px 0;margin-top:32px}.rules-body .label{margin-top:18px}.rules-body ol{padding-left:1.4em}.gestures{grid-template-columns:repeat(2,minmax(0,1fr))}.gest{padding:14px 12px}.gest b{font-size:1.15rem}}

/* news / blog */
.posts{display:grid;gap:0;margin-top:24px}
.post{display:grid;grid-template-columns:140px 1fr;gap:24px;padding-block:22px;border-top:1px solid var(--line)}
.post-img{display:block;width:100%;max-width:560px;aspect-ratio:16/9;object-fit:cover;border-radius:4px;margin-bottom:14px;border:1px solid var(--line)}
.post time{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.post p{color:var(--muted);margin-top:6px;max-width:68ch}
.post .tag{display:inline-block;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--brass);margin-bottom:6px}
.post details summary{cursor:pointer;color:var(--red);font-weight:700;margin-top:8px}
.post details div{margin-top:10px;display:flex;flex-direction:column;gap:10px;max-width:68ch}
@media (max-width:600px){.post{grid-template-columns:1fr;gap:6px}}

/* contacts */
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:16px;margin-top:24px}
.contact>div{border-top:1px solid var(--brass);padding-top:14px}
.contact .val{font-weight:700;user-select:all}

.wa{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:16px;padding:16px 20px;border-radius:14px;background:var(--surface);border:1px solid var(--ok)}
.wa p{flex:1 1 240px}
.btn.wa-btn{background:var(--ok);border-color:var(--ok);color:var(--red-ink)}
.check{display:flex;gap:8px;align-items:flex-start;flex-basis:100%;font-size:.9rem;color:var(--muted)}
.check input{margin-top:4px}
.crm-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-top:20px}
.crm-tools select{padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.tbl{overflow-x:auto;margin-top:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.92rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:.75rem;padding:2px 9px;border-radius:999px;border:1px solid var(--line)}
.pill.in{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.kpis{display:flex;gap:28px;flex-wrap:wrap;margin-top:20px}
.kpis div{display:flex;flex-direction:column}
.kpis strong{font-family:var(--f-mono);font-size:1.5rem;font-variant-numeric:tabular-nums}
body.admin-mode nav.menu, body.admin-mode footer{display:none}
.adm-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.adm-tabs{display:flex;gap:6px;flex-wrap:wrap}
.adm-tabs button{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.adm-tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.composer{display:grid;grid-template-columns:260px 1fr;gap:24px;margin-top:20px}
.composer .opts{display:flex;flex-direction:column;gap:14px}
.composer label{display:flex;flex-direction:column;gap:4px}
.composer select{padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.composer textarea{width:100%;min-height:300px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-family:var(--f-body);font-size:.95rem;line-height:1.5;resize:vertical}
.composer .send{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.howto{margin-top:12px;font-size:.9rem;color:var(--muted);max-width:62ch}
.denied{padding-block:60px;max-width:52ch}
@media (max-width:720px){.composer{grid-template-columns:1fr}}

/* ===== 2026 effects ===== */
/* film grain */
body::after{content:"";position:fixed;inset:0;z-index:30;pointer-events:none;opacity:.07;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
/* ticker */
.ticker{overflow:hidden;border-block:1px solid var(--line);background:var(--surface);padding-block:14px;white-space:nowrap}
.ticker-track{display:inline-flex;gap:48px;font-family:var(--f-display);font-style:italic;font-size:1.5rem;color:var(--muted)}
.ticker-track span::after{content:"✦";margin-left:48px;color:var(--red);font-style:normal;font-size:.8rem;vertical-align:middle}
/* spotlight cards */
.spot{position:relative;overflow:hidden}
.spot::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(360px circle at var(--mx,50%) var(--my,50%),rgba(201,166,107,.16),transparent 60%)}
.spot:hover::before{opacity:1}
/* gallery captions */
.gallery figure{position:relative}
.gallery figure.wide{grid-column:1/-1;aspect-ratio:5/2}
.gallery figure.wide img{scale:1!important;translate:none!important;animation:none!important}
@media (max-width:640px){.gallery figure.wide{aspect-ratio:16/9}}
.gallery figcaption{position:absolute;left:0;right:0;bottom:0;padding:40px 14px 12px;background:linear-gradient(transparent,rgba(17,12,10,.85));font-family:var(--f-display);font-style:italic;font-size:1.15rem;color:var(--fg)}
@media (prefers-reduced-motion:no-preference){
  .hero-img.on{animation:kenburns 22s ease-out both}
  @keyframes kenburns{from{transform:scale(1.12)}to{transform:scale(1)}}

/* ---------- i18n ---------- */
let lang = "ru";
try{ const s = localStorage.getItem("mk_lang"); if(s==="ru"||s==="tr") lang=s; }catch(e){}
const t = k => (T[lang][k] ?? k);
const loc = () => lang==="ru" ? "ru-RU" : "tr-TR";

function applyI18n(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(el=>{ el.textContent = t(el.dataset.i); });
  document.querySelectorAll("[data-ih]").forEach(el=>{ el.innerHTML = t(el.dataset.ih); });
  const h1=document.querySelector(".hero-inner h1"); let wi=0;
  h1.querySelectorAll("em").forEach(()=>{});
  [...h1.childNodes].forEach(node=>{
    const wrapWords=(txt,parent)=>{ txt.split(/(\s+)/).forEach(part=>{ if(!part) return; if(/^\s+$/.test(part)){ parent.append(part); return; }
      const sp=document.createElement("span"); sp.className="w"; sp.style.setProperty("--i",wi++); sp.textContent=part; parent.append(sp); }); };
    if(node.nodeType===3){ const frag=document.createDocumentFragment(); wrapWords(node.textContent,frag); node.replaceWith(frag); }
    else if(node.nodeType===1){ const txt=node.textContent; node.textContent=""; wrapWords(txt,node); }
  });
  const tk=document.getElementById("ticker"); tk.textContent="";
  const phrases=["Город засыпает","Просыпается мафия","Şehir uyuyor","Mafya uyanıyor","19:00","Ночь. Город. Ложь.","Gece. Şehir. Yalan."];
  for(let r=0;r<2;r++) phrases.forEach(x=>{ const sp=document.createElement("span"); sp.textContent=x; tk.append(sp); });
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===lang));
  const dayNames = CONFIG.gameDays.map(d=>new Intl.DateTimeFormat(loc(),{weekday:"short"}).format(new Date(2024,0,7+d)));
  document.getElementById("fact-days").textContent = dayNames.join(" ");
  const full = CONFIG.gameDays.map(d=>new Intl.DateTimeFormat(loc(),{weekday:"long"}).format(new Date(2024,0,7+d)));
  document.getElementById("ct-when").textContent = full.join(", ")+" · "+CONFIG.time;
  setNote(noteKey);
  if(window.__booted) renderPhotos();
  renderPosts("news-list", NEWS);
  renderPosts("blog-list", BLOG);
  renderGames();
}

const VIEWS=["home","schedule","rules","news","blog","contacts","admin"];
function route(){

const pad=n=>String(n).padStart(2,"0");
const keyOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function upcoming(){
  const out=[]; const now=new Date(); const [hh,mm]=CONFIG.time.split(":").map(Number);
  for(let i=0;i<=CONFIG.bookDays;i++){
    const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i, hh, mm);
    if(!CONFIG.gameDays.includes(d.getDay())) continue;
    if(d.getTime()+3*3600e3 < now.getTime()) continue; // hide games that already finished
    out.push(d);
  }
  return out;
}

function playersFor(key,table){
  return docs.filter(x=>Array.isArray(x.dates)&&x.dates.includes(key)&&(!table||tableOf(x,key)===table))
    .sort((a,b)=>((a.ts||{})[key]||0)-((b.ts||{})[key]||0));
}
function myPlace(key){ for(const tb of [1,2]){ const l=playersFor(key,tb); const i=l.findIndex(p=>p.uid===myId); if(i>=0) return {table:tb,idx:i}; } return null; }

function dateLabel(d){
  const today=new Date(); const tm=new Date(today.getFullYear(),today.getMonth(),today.getDate()+1);
  if(keyOf(d)===keyOf(today)) return t("today");
  if(keyOf(d)===keyOf(tm)) return t("tomorrow");
  return new Intl.DateTimeFormat(loc(),{weekday:"long"}).format(d);
}

function utcStamp(key){ const [y,m,dd]=key.split("-").map(Number); const [hh,mm]=CONFIG.time.split(":").map(Number);
  const start=new Date(Date.UTC(y,m-1,dd,hh-CONFIG.utcOffset,mm)); const end=new Date(start.getTime()+CONFIG.durationHours*3600e3);
  const f=x=>x.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,""); return [f(start),f(end)]; }
function calPlace(){ return t("ct_place_v"); }
function googleCal(key){ const [a,b]=utcStamp(key);
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(t("cal_title"))+"&dates="+a+"/"+b+"&details="+encodeURIComponent(t("cal_desc")+"\n"+CONFIG.siteUrl)+"&location="+encodeURIComponent(calPlace()); }
function outlookCal(key){ const [y,m,dd]=key.split("-"); const [hh,mm]=CONFIG.time.split(":").map(Number);
  const off=(CONFIG.utcOffset>=0?"+":"-")+String(Math.abs(CONFIG.utcOffset)).padStart(2,"0")+":00";
  const st=`${y}-${m}-${dd}T${pad(hh)}:${pad(mm)}:00${off}`; const enH=hh+CONFIG.durationHours; const en=`${y}-${m}-${dd}T${pad(enH)}:${pad(mm)}:00${off}`;
  return "https://outlook.live.com/calendar/0/deeplink/compose?path=/calendar/action/compose&rru=addevent&subject="+encodeURIComponent(t("cal_title"))+"&startdt="+encodeURIComponent(st)+"&enddt="+encodeURIComponent(en)+"&body="+encodeURIComponent(t("cal_desc")+"\n"+CONFIG.siteUrl)+"&location="+encodeURIComponent(calPlace()); }
function calRow(key){ const row=document.createElement("div"); row.className="cal";

  row.append(l);

function tableBlock(key,tb,compact,me){
  const list=playersFor(key,tb); const main=list.slice(0,CONFIG.seats), wait=list.slice(CONFIG.seats);
  const box=document.createElement("div"); box.className="tbl-block";
  const h=document.createElement("div"); h.className="tbl-head";
  const nm=document.createElement("span"); nm.className="tbl-name"; nm.textContent=t(tb===1?"tbl1":"tbl2");
  const cnt=document.createElement("span"); cnt.className="tbl-count"; cnt.textContent=dbReady? (main.length+"/"+CONFIG.seats+(wait.length?" +"+wait.length:"")) : "";
  h.append(nm,cnt);
  const seats=document.createElement("div"); seats.className="seats"; seats.setAttribute("aria-hidden","true");
  const myI= me&&me.table===tb ? me.idx : -1;
  for(let i=0;i<CONFIG.seats;i++){ const s=document.createElement("div"); s.className="seat"+(i<main.length?" taken":"")+(i===myI?" me":""); s.textContent=i+1; seats.append(s); }
  box.append(h,seats);
  if(!compact && list.length){
    const ul=document.createElement("ul"); ul.className="players";
    list.forEach((p,i)=>{ const li=document.createElement("li"); if(i>=CONFIG.seats) li.className="wait";
      const n=document.createElement("span"); n.className="n"; n.textContent=i<CONFIG.seats?("#"+(i+1)):"…";
      const nm2=document.createElement("span"); nm2.textContent=p.name||"—"; li.append(n,nm2); ul.append(li); });
    box.append(ul);
  }
  return box;
}
function gameCard(d, compact){
  const key=keyOf(d); const me=myPlace(key);
  const all=playersFor(key);
  const card=document.createElement("div"); card.className="game"; if(!compact) card.id="g-"+key;
  const head=document.createElement("div"); head.className="game-head";
  const left=document.createElement("div");
  const lbl=document.createElement("div"); lbl.className="label"; lbl.textContent=compact?t("next"):dateLabel(d);
  const dt=document.createElement("div"); dt.className="game-date";
  dt.textContent=new Intl.DateTimeFormat(loc(),{day:"numeric",month:"long"}).format(d)+(compact?", "+dateLabel(d).toLowerCase():"");
  left.append(lbl,dt);
  const tm=document.createElement("div"); tm.className="game-time"; tm.textContent=CONFIG.time;
  head.append(left,tm);
  card.append(head, tableBlock(key,1,compact,me), tableBlock(key,2,compact,me));
  const st=document.createElement("p"); st.className="status";
  if(dbReady && !all.length) st.innerHTML=t("st_empty");
  if(me){ const y=document.createElement("b"); y.style.display="block"; y.style.color="var(--red)";
    y.textContent = me.idx<CONFIG.seats ? t("you_in").replace("{t}",me.table).replace("{n}",me.idx+1) : t("you_wait").replace("{t}",me.table).replace("{n}",me.idx-CONFIG.seats+1); st.append(y); }
  if(st.childNodes.length) card.append(st);
  const btn=document.createElement("button"); btn.type="button"; btn.className="btn small"+(me?"":" primary");
  const full = [1,2].every(tb=>playersFor(key,tb).length >= CONFIG.seats+CONFIG.waitlist);
  btn.textContent = me ? t("leave") : t("join");
  btn.disabled = !db || !dbReady || (!me && full);
  if(compact){ const a=document.createElement("a"); a.className="btn primary small"; a.href="#schedule"; a.textContent=t("cta_join"); card.append(a); }
  else { btn.addEventListener("click",()=> me ? openCancel(key) : startJoin(key)); card.append(btn); if(me) card.append(calRow(key)); }
  return card;
}

function renderYear(){
  const box=document.getElementById("year"); if(!box) return; box.textContent="";
  const now=new Date(); const today=keyOf(now);
  const openKeys=new Set(upcoming().map(keyOf));
  const lastOpen=new Date(now.getFullYear(),now.getMonth(),now.getDate()+CONFIG.bookDays);
  const wdN=[...Array(7)].map((_,i)=>new Intl.DateTimeFormat(loc(),{weekday:"short"}).format(new Date(2024,0,1+i)).slice(0,2));
  for(let m=0;m<CONFIG.yearMonths;m++){
    const first=new Date(now.getFullYear(),now.getMonth()+m,1); const days=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
    const mo=document.createElement("div"); mo.className="month";
    const h=document.createElement("h3"); h.textContent=new Intl.DateTimeFormat(loc(),{month:"long"}).format(first)+" "+first.getFullYear();
    let games=0; for(let d=1;d<=days;d++){ if(CONFIG.gameDays.includes(new Date(first.getFullYear(),first.getMonth(),d).getDay())) games++; }
    const sm=document.createElement("small"); sm.textContent=t("yr_games").replace("{n}",games); h.append(sm);
    const g=document.createElement("div"); g.className="mgrid";
    wdN.forEach(w=>{ const e=document.createElement("span"); e.className="wd"; e.textContent=w; g.append(e); });
    const lead=(first.getDay()+6)%7; for(let i=0;i<lead;i++) g.append(document.createElement("span"));
    for(let d=1;d<=days;d++){
      const dt=new Date(first.getFullYear(),first.getMonth(),d); const k=keyOf(dt);
      const isGame=CONFIG.gameDays.includes(dt.getDay());
      const el=document.createElement(isGame?"button":"span"); el.className="dc"; el.textContent=d;
      if(k<today) el.classList.add("past"); if(k===today) el.classList.add("today");
      if(isGame){ el.type="button"; el.classList.add("game");
        const label=new Intl.DateTimeFormat(loc(),{weekday:"long",day:"numeric",month:"long"}).format(dt);
        if(k<today){ el.disabled=true; }
        else if(openKeys.has(k)){ const mine=myPlace(k); el.classList.add(mine?"mine":"open"); el.setAttribute("aria-label",label+" · "+t(mine?"yr_l_mine":"yr_l_open"));
          el.addEventListener("click",()=>{ const c=document.getElementById("g-"+k); if(c){ c.scrollIntoView({behavior:"smooth",block:"center"}); c.classList.add("flash"); setTimeout(()=>c.classList.remove("flash"),1600); } }); }
        else { el.classList.add("soon"); const od=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()-CONFIG.bookDays);
          const msg=t("yr_locked").replace("{d}",new Intl.DateTimeFormat(loc(),{day:"numeric",month:"long"}).format(dt)).replace("{o}",new Intl.DateTimeFormat(loc(),{day:"numeric",month:"long"}).format(od));
          el.setAttribute("aria-label",label+" · "+msg); el.title=msg; el.addEventListener("click",()=>toast(msg)); }
      }
      g.append(el);
    }
    mo.append(h,g); box.append(mo);
  }
}

let toastTimer;
function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.hidden=true,2600); }

let busy=false;
async function toggle(key, leaving, table){
  if(busy||!db||!myId) return;
  if(!leaving && !nick){ toast(t("need_nick")); nickInput.focus(); return; }
  const np=normPhone(phone);
  if(!leaving && !np){ toast(t("need_phone")); phoneInput.focus(); return; }
  if(!leaving && !consentBox.checked && myPhoneSaved!==np){ toast(t("need_consent")); consentBox.focus(); return; }
  busy=true;
  if(!leaving && myPhoneSaved!==np){
    try{ await db.collection("phones").doc(myId).set({phone:np,name:nick.slice(0,40),consent:true,consentAt:Date.now()}); myPhoneSaved=np; }
    catch(e){ toast(t("err")); busy=false; return; }
  }
  const mine=docs.find(x=>x.uid===myId) || {uid:myId,name:nick,dates:[],ts:{},tables:{}};
  const dates=new Set(mine.dates||[]); const ts={...(mine.ts||{})}; const tables={...(mine.tables||{})};
  if(leaving){ dates.delete(key); delete ts[key]; delete tables[key]; } else { dates.add(key); ts[key]=Date.now(); tables[key]=table===2?2:1; }
  const keep=[...dates].sort().slice(-80); const ts2={}, tb2={}; keep.forEach(k=>{ if(ts[k]) ts2[k]=ts[k]; if(tables[k]) tb2[k]=tables[k]; });
  try{
    await db.collection("signups").doc(myId).set({uid:myId,name:(nick||mine.name||"").slice(0,40),dates:keep,ts:ts2,tables:tb2,updatedAt:Date.now()});
    if(leaving) toast(t("left"));
    busy=false; return true;
  }catch(e){ toast(t("err")); }
  busy=false; return false;

function paintHero(){
  const c=document.getElementById("hero-canvas"); const r=c.getBoundingClientRect(); const dpr=Math.min(2,window.devicePixelRatio||1);
  c.width=Math.max(1,r.width*dpr); c.height=Math.max(1,r.height*dpr); const x=c.getContext("2d"); x.scale(dpr,dpr);
  const W=r.width,H=r.height; const g=x.createLinearGradient(0,0,W,H); g.addColorStop(0,"#2a1712"); g.addColorStop(.55,"#160f0c"); g.addColorStop(1,"#0d0908"); x.fillStyle=g; x.fillRect(0,0,W,H);
  let seed=7; const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
  const warm=["255,190,120","255,150,90","230,120,70","255,215,160"];
  for(let i=0;i<70;i++){ const px=rnd()*W, py=rnd()*H*.75, rad=8+rnd()*Math.min(90,W*.08), a=.04+rnd()*.16;
    const col=warm[Math.floor(rnd()*warm.length)]; const rg=x.createRadialGradient(px,py,0,px,py,rad);
    rg.addColorStop(0,`rgba(${col},${a})`); rg.addColorStop(.7,`rgba(${col},${a*.5})`); rg.addColorStop(1,`rgba(${col},0)`); x.fillStyle=rg; x.beginPath(); x.arc(px,py,rad,0,Math.PI*2); x.fill(); }
  const lamp=x.createRadialGradient(W*.72,H*.35,0,W*.72,H*.35,Math.max(W,H)*.5); lamp.addColorStop(0,"rgba(196,53,43,.22)"); lamp.addColorStop(1,"rgba(196,53,43,0)"); x.fillStyle=lamp; x.fillRect(0,0,W,H);
}

      if(me && !nick){ nick=me.name||""; nickInput.value=nick; }
      setNote("db_ok"); renderGames();
    }, ()=>{ clearTimeout(slow); setNote("db_slow"); });
    db.collection("phones").doc(myId).get().then(s=>{ if(s.exists){ const d=s.data()||{}; myPhoneSaved=d.phone||null; if(!phone&&d.phone){ phone=d.phone; phoneInput.value=phone; } consentBox.checked=!!d.consent; } }).catch(()=>{});
    db.collection("settings").doc("site").onSnapshot(s=>{ site=s.exists?(s.data()||{}):{hero:null,gallery:[]}; renderPhotos(); },()=>{});
    if(isAdmin){ window.claude.use("assets").then(a=>{ assets=a; if(!a){ document.getElementById("up-hero").disabled=true; document.getElementById("up-gal").disabled=true; } }); }
    if(isAdmin){ db.collection("phones").onSnapshot(snap=>{ phones={}; snap.docs.forEach(d=>phones[d.id]=d.data()||{}); renderAdmin(); },()=>{}); }
  }catch(e){ clearTimeout(slow); db=null; authChecked=true; route(); setNote("db_off"); renderGames(); }
})();
</script>

</body>
</html>
